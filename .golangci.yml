version: "2"
run:
  issues-exit-code: 1
linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G701
        - G702
        - G703
        - G704
        - G705
        - G706
        - G707
        - G708
        - G709
        - G710
        - G118
        - G122
    staticcheck:
      checks:
        - all
        - -QF1012
        - -QF1007
        - -QF1001
        - -S1017
        - -S1039
        - -S1009
        - -ST1005
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
