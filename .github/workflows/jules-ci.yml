name: La Famille Integration Pipeline

on:
  pull_request:
    branches: [ master ]

jobs:
  # Verification only — this workflow is not a merge authority.
  # Merges of labeled bot PRs are performed exclusively by the nightly
  # "Clear the Litterbox" job (cron-sync.yml).
  verify-jules-pr:
    # Only run this if the PR was created by the Jules bot / integration
    if: github.actor == 'google-labs-code' || github.actor == 'google-labs-jules' || startsWith(github.head_ref, 'jules')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Run Verification Suite
        run: |
          go test -v ./...

      - name: Run Tests with Race Detector
        run: |
          go test -race ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
