name: Lint

on:
  pull_request:
    branches: [ master, main ]

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
      - name: Check technical-debt markers
        run: bash .github/scripts/quality/check-tech-debt.sh
      - name: Check tracked file sizes
        run: bash .github/scripts/quality/check-file-sizes.sh
      - name: Validate AGENTS.md
        run: bash .github/scripts/quality/check-agents-md.sh
      - name: Guard Ask log scrubbing
        run: bash .github/scripts/quality/check-log-scrub.sh
