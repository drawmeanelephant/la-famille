name: Deploy La Famille Site

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger
    inputs:
      site_url:
        description: 'Public base URL of the deployed site'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build Static Site
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL || steps.pages.outputs.base_url }}
        run: |
          # Executes the La Famille compiler
          if [ -n "$SITE_URL" ]; then
            go run ./cmd/la-famille build --site-url "$SITE_URL"
          else
            go run ./cmd/la-famille build
          fi

      - name: Generate RAG Export
        run: |
          go run ./cmd/la-famille rag
          cp -r rag-archive public/rag-archive

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public' # Target the generator's output directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
