name: Release La Famille

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package'
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test source and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and smoke test
        env:
          GOOS_VALUE: ${{ matrix.goos }}
          GOARCH_VALUE: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          STAGE="$RUNNER_TEMP/la-famille-$GOOS_VALUE-$GOARCH_VALUE"
          mkdir -p "$STAGE"
          BIN="la-famille"
          if [ "$GOOS_VALUE" = "windows" ]; then BIN="la-famille.exe"; fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          GOOS="$GOOS_VALUE" GOARCH="$GOARCH_VALUE" CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X main.buildVersion=$TAG -X main.buildCommit=$GITHUB_SHA -X main.buildDate=$BUILD_DATE" \
            -o "$STAGE/$BIN" ./cmd/la-famille

          # Cross-target archives cannot execute on the Ubuntu runner. The
          # native linux/amd64 package gets the full offline CLI smoke test;
          # every other advertised target is still required to cross-build.
          if [ "$GOOS_VALUE/$GOARCH_VALUE" = "linux/amd64" ]; then
            "$STAGE/$BIN" --version
            "$STAGE/$BIN" --version --json
            "$STAGE/$BIN" --help >/dev/null

            # Run the full archive contract offline on the native target:
            # invalid input, init, new, check, build, and publish validation.
            SMOKE_ROOT="$RUNNER_TEMP/la-famille-smoke"
            mkdir -p "$SMOKE_ROOT"
            if "$STAGE/$BIN" --definitely-not-a-la-famille-flag >/dev/null 2>&1; then
              echo "invalid CLI input unexpectedly succeeded" >&2
              exit 1
            fi
            "$STAGE/$BIN" --project-root "$SMOKE_ROOT" init
            "$STAGE/$BIN" --project-root "$SMOKE_ROOT" new index --title "Release Smoke" --date 2026-08-01
            "$STAGE/$BIN" --project-root "$SMOKE_ROOT" check
            "$STAGE/$BIN" --project-root "$SMOKE_ROOT" build
            "$STAGE/$BIN" --project-root "$SMOKE_ROOT" publish-check --output public --json
          fi

          cp README.md NOTICE RELEASE-QUICKSTART.md "$STAGE/"
          ARCHIVE="la-famille_${VERSION}_${GOOS_VALUE}_${GOARCH_VALUE}.tar.gz"
          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "$STAGE" .
          printf '%s\n' "$ARCHIVE" > "$RUNNER_TEMP/archive-name"
      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/la-famille_*.tar.gz

  publish:
    name: Publish release archives
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Create checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          sha256sum la-famille_*.tar.gz > SHA256SUMS
          TAG="$RELEASE_TAG"
          gh release create "$TAG" --verify-tag --title "La Famille $TAG" --generate-notes la-famille_*.tar.gz SHA256SUMS
