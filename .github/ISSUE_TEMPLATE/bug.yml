name: Bug report
description: Report a reproducible problem in La Famille.
title: "[bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest project and command sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Add ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide `la-famille --version --json` output or the commit.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already run
      description: Include relevant `go test`, `go vet`, or `la-famille check` results.
